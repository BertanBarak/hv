<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hakan Volkan Kuyumculuk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(255,255,255,0.45),
                    transparent 35%
                ),
                #eee5d7;

            color: #3d3228;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 45px 24px 55px;
            text-align: center;
        }

        /* LOGO */

        .logo {
            width: 235px;
            max-width: 75%;
            height: auto;
            display: block;
            margin: 0 auto 25px;
        }

        /* SLOGAN */

        .slogan {
            font-size: 20px;
            font-style: italic;
            color: #a4772c;
            letter-spacing: 1px;
            margin-bottom: 42px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .button {
            position: relative;

            min-height: 78px;

            display: flex;
            align-items: center;

            text-decoration: none;

            background: rgba(255, 250, 242, 0.78);

            border: 1.5px solid #c69a4c;
            border-radius: 22px;

            color: #3d3228;

            box-shadow:
                0 8px 22px rgba(95, 72, 42, 0.08);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            background: #fffaf1;

            box-shadow:
                0 12px 28px rgba(95, 72, 42, 0.13);
        }

        /* ICON */

        .icon-box {
            width: 58px;
            height: 58px;

            margin-left: 14px;

            border-radius: 50%;

            background: #ae7c2d;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .icon {
            width: 29px;
            height: 29px;

            fill: none;
            stroke: #fffaf1;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* AYIRICI */

        .separator {
            width: 1px;
            height: 38px;

            background: #c7a36b;

            margin-left: 22px;
            margin-right: 22px;
        }

        /* BUTON YAZISI */

        .button-text {
            flex: 1;

            text-align: left;

            font-size: 18px;
            letter-spacing: 1px;
        }

        /* SAĞ OK */

        .arrow {
            font-family: Arial, sans-serif;

            font-size: 30px;
            font-weight: 300;

            color: #9c702d;

            margin-right: 23px;
        }

        /* ADRES */

        .address-line {
            width: 140px;
            height: 1px;

            background: #bd9452;

            margin: 48px auto 25px;
        }

        .address {
            font-size: 16px;
            line-height: 1.8;

            color: #62564b;

            letter-spacing: 0.3px;
        }

        /* ALT DEKOR */

        .bottom-decoration {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-top: 38px;
        }

        .bottom-decoration span {
            width: 95px;
            height: 1px;
            background: #bd9452;
        }

        .diamond {
            color: #ae7c2d;
            font-size: 19px;
        }

        /* MOBİL */

        @media (max-width: 420px) {

            .container {
                padding: 32px 18px 45px;
            }

            .logo {
                width: 205px;
            }

            .slogan {
                font-size: 17px;
                margin-bottom: 32px;
            }

            .button {
                min-height: 70px;
                border-radius: 18px;
            }

            .icon-box {
                width: 50px;
                height: 50px;
                margin-left: 10px;
            }

            .icon {
                width: 25px;
                height: 25px;
            }

            .separator {
                margin-left: 15px;
                margin-right: 15px;
            }

            .button-text {
                font-size: 16px;
            }

            .arrow {
                margin-right: 16px;
                font-size: 26px;
            }

            .address {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- LOGO -->
    <!-- logo.png dosyasını index.html ile aynı klasöre koy -->
    <img
        src="logo.png"
        alt="Hakan Volkan Kuyumculuk"
        class="logo"
    >


    <!-- SLOGAN -->
    <div class="slogan">
        Değeriniz, bizim için özel...
    </div>


    <!-- BUTONLAR -->
    <div class="buttons">


        <!-- KONUM -->
        <a
            class="button"
            href="https://www.google.com/maps/place//data=!4m2!3m1!1s0x14d34e55a147fdb5:0xa214d39268bbeb31?sa=X%26ved=1t:8290%26ictx=111"
            target="_blank"
        >

            <div class="icon-box">

                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/>
                    <circle cx="12" cy="9" r="2.5"/>
                </svg>

            </div>

            <div class="separator"></div>

            <div class="button-text">
                Mağazaya Yol Tarifi
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- TELEFON -->
        <a
            class="button"
            href="tel:+903124343229"
        >

            <div class="icon-box">

                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M6.5 3.5l3 2.5-2 3.2c1.1 2.2 2.8 3.9 5 5l3.2-2 2.5 3c.5.6.4 1.5-.2 2l-1.5 1.1c-.8.6-1.8.8-2.7.5C7.8 17 4 13.2 3.2 7.2c-.2-.9.1-1.9.7-2.7L5 3.2c.4-.4 1-.3 1.5.3z"/>
                </svg>

            </div>

            <div class="separator"></div>

            <div class="button-text">
                (0312) 434 32 29
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- INSTAGRAM -->
        <a
            class="button"
            href="https://www.instagram.com/hakanvolkanmucevherat/"
            target="_blank"
        >

            <div class="icon-box">

                <svg class="icon" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.5" cy="6.5" r="1"/>
                </svg>

            </div>

            <div class="separator"></div>

            <div class="button-text">
                Instagram
            </div>

            <div class="arrow">
                ›
            </div>

        </a>

    </div>


    <!-- ADRES -->
    <div class="address-line"></div>

    <div class="address">
        67/113 Atatürk Bulvarı &amp; Büyük Çarşı<br>
        Kızılay Mahallesi, Çankaya / Ankara<br>
        06420
    </div>


    <!-- ALT DEKOR -->
    <div class="bottom-decoration">
        <span></span>

        <div class="diamond">◇</div>

        <span></span>
    </div>

</div>

</body>
</html>
